services:
    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_DB: ${POSTGRES_DATABASE}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
        volumes:
            - db_data:/var/lib/postgresql/data

    back:
        build: ./back
        depends_on:
            - db
        environment:
            DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_USER_PASSWORD}@db/${POSTGRES_DATABASE}
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_USER_PASSWORD}
            DB_NAME: ${POSTGRES_DATABASE}
        ports:
            - "8000:8000"
        secrets:
            - .env

    front:
        build: ./front
        ports:
            - "80:80"
        depends_on:
            - back

volumes:
    db_data:

secrets: 
    .env:
        ./.env